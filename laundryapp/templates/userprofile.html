{% extends 'header_footer_user.html' %}

{% block content %}
<style>
  .edit-form-container {
    max-width: 700px;
    margin: 40px auto;
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
  }

  .edit-form-container h2 {
    text-align: center;
    color: #0d6efd;
    font-weight: bold;
    margin-bottom: 30px;
  }

  .btn-submit {
    background-color: #fd7e14;
    color: white;
    border: none;
    transition: background-color 0.3s ease;
  }

  .btn-submit:hover {
    background-color: #0d6efd;
  }
</style>

<div class="container">
  <div class="edit-form-container">
    <h2>Edit Profile</h2>

    <form action="/edituser/" method="get">
      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" name="name" id="name" required value="{{ name }}">
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <textarea class="form-control" name="address" id="address" rows="3" required>{{ address }}</textarea>
      </div>

      <div class="mb-3">
        <label for="district" class="form-label">District</label>
        <select name="district" required value="{{district}}">
                            <option ></option>
                            <option value="thiruvananthapuram" {% if district == "thiruvananthapuram" %}selected{% endif %}>Thiruvananthapuram</option>
                            <option value="kollam" {% if district == "kollam" %}selected{% endif %}>Kollam</option>
                            <option value="alappuzha" {% if district == "alappuzha" %}selected{% endif %}>Alappuzha</option>
                            <option value="pathanamthitta" {% if district == "pathanamthitta" %}selected{% endif %}>Pathanamthitta</option>
                            <option value="kottayam" {% if district == "kottayam" %}selected{% endif %}>Kottayam</option>
                            <option value="idukki" {% if district == "idukki" %}selected{% endif %}>Idukki</option>
                            <option value="ernakulam" {% if district == "ernakulam" %}selected{% endif %}>Ernakulam</option>
                            <option value="thrissur" {% if district == "thrissur" %}selected{% endif %}>Thrissur</option>
                            <option value="palakkad" {% if district == "palakkad" %}selected{% endif %}>Palakkad</option>
                            <option value="malappuram" {% if district == "malappuram" %}selected{% endif %}>Malappuram</option>
                            <option value="kozhikode" {% if district == "kozhikode" %}selected{% endif %}>Kozhikode</option>
                            <option value="wayanad" {% if district == "wayanad" %}selected{% endif %}>Wayanad</option>
                            <option value="kannur" {% if district == "kannur" %}selected{% endif %}>Kannur</option>
                            <option value="kasaragod" {% if district == "kasaragod" %}selected{% endif %}>Kasaragod</option>
                        </select>
      </div>

      <div class="mb-3">
        <label for="place" class="form-label">Place</label>
        <input type="text" class="form-control" name="place" id="place" required value="{{ place }}">
      </div>

      <div class="mb-3">
        <label for="phn" class="form-label">Phone</label>
        <input type="text" class="form-control" name="phn" id="phn" required pattern="[0-9]{10}" maxlength="10" value="{{ phn }}">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" name="email" id="email" required value="{{ email }}">
      </div>

      <div class="d-grid">
        <input type="submit" value="Update Profile" class="btn btn-submit">
      </div>
    </form>

    <div class="text-center mt-4">
      <a href="/showpassword" class="text-decoration-none text-primary">Change Password</a>
    </div>
  </div>
</div>
{% endblock %}
