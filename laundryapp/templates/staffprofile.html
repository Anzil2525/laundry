{% extends temp %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Profile</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0 20px;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 30px auto 10px auto;
            max-width: 800px;
        }

        .profile-header h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 28px;
        }

        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .form-container {
            background-color: white;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        input[type="submit"] {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #2980b9;
        }

        .extra-links {
            text-align: right;
            margin-top: 15px;
        }

        .extra-links a {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="profile-header">
        <h1>👨‍🔧 Staff Profile</h1>
    </div>

    <div class="form-container">
        <form action="/editstaff/" method="get">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" pattern="[A-Z a-z]+" title="Use Ony Alphabets" required value="{{ name }}">

            <label for="address">Address</label>
            <textarea id="address" name="address" rows="4" title="Enter address" required>{{ address }}</textarea>

            <label for="street">Street</label>
            <input type="text" id="street" name="street" pattern="[A-Z a-z]+" title="Use Ony Alphabets" required value="{{ street }}">

            <label for="city">City</label>
            <input type="text" id="city" name="city" pattern="[A-Z a-z]+" title="Use Ony Alphabets" required value="{{ city }}">

            <label for="district">District</label>
            <select name="district" title="Select district" required value="{{district}}">
                            <option ></option>
                            <option value="thiruvananthapuram" {% if district == "thiruvananthapuram" %}selected{% endif %}>Thiruvananthapuram</option>
                            <option value="kollam" {% if district == "kollam" %}selected{% endif %}>Kollam</option>
                            <option value="alappuzha" {% if district == "alappuzha" %}selected{% endif %}>Alappuzha</option>
                            <option value="pathanamthitta" {% if district == "pathanamthitta" %}selected{% endif %}>Pathanamthitta</option>
                            <option value="kottayam" {% if district == "kottayam" %}selected{% endif %}>Kottayam</option>
                            <option value="idukki" {% if district == "idukki" %}selected{% endif %}>Idukki</option>
                            <option value="ernakulam" {% if district == "ernakulam" %}selected{% endif %}>Ernakulam</option>
                            <option value="thrissur" {% if district == "thrissur" %}selected{% endif %}>Thrissur</option>
                            <option value="palakkad" {% if district == "palakkad" %}selected{% endif %}>Palakkad</option>
                            <option value="malappuram" {% if district == "malappuram" %}selected{% endif %}>Malappuram</option>
                            <option value="kozhikode" {% if district == "kozhikode" %}selected{% endif %}>Kozhikode</option>
                            <option value="wayanad" {% if district == "wayanad" %}selected{% endif %}>Wayanad</option>
                            <option value="kannur" {% if district == "kannur" %}selected{% endif %}>Kannur</option>
                            <option value="kasaragod" {% if district == "kasaragod" %}selected{% endif %}>Kasaragod</option>
                        </select>

            <label for="ph_no">Phone Number</label>
            <input type="text" id="ph_no" name="ph_no" pattern="[0-9]{10}" maxlength="10" title="Enter a valid 10-digit phone number"" required value="{{ phn }}">

            <label for="pincode">Pin Code</label>
            <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6" title="Enter a valid 6-digit pincode"" required value="{{ pin }}">

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required value="{{ dob }}">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Email must be in the format: example@domain.com" required value="{{ email }}">

            <input type="hidden"name="id" value="{{ stid }}">
            <input type="submit"  value="Update Profile">
        </form>

        {% if utype == 'staff' %}
        <div class="extra-links">
            <a href="/showpassword">🔐 Change Password</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
{% endblock %}
