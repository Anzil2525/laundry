<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f9f9f9;
        }
        .feedback-container {
            width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
        }
        textarea {
            width: 100%;
            resize: vertical;
        }
        input[type="submit"] {
            margin-top: 10px;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    {% extends temp %}
    {% block content %}
    <div class="feedback-container">
        <h1>Feedback</h1>
        <form action="/addfeedback/">
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            <label for="feedback">Your Feedback:</label><br>
            <textarea id="feedback" name="feedback" rows="5" required></textarea><br>
            <input type="submit" value="Submit">
        </form>
    </div>
    {% endblock %}
</body>
</html>
