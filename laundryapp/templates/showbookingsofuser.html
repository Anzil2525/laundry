<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="/userhome">Back</a>
    <br>
    <h1><u><b>Booked Service</b></u></h1>
    <table border="1">
        <tr>
            <th>service</th>
            <th>shop</th>
            <th>Amount</th>
            <th>date</th>
            <th>time</th>
            <th>Status</th>
        </tr>
        {% for i in data %}
        <tr>
            <td>{{i.service}}</td>
            <td>{{ i.shop }}</td>
            <td>{{ i.amount }}</td>
            <td>{{ i.date }}</td>
            <td>{{ i.time }}</td>
            <td>{{ i.status }}</td>
            <td><a href="/viewbookdetailsbyuser/?oid={{ i.oid }}">View Details</a></td>
        {% endfor %}
    </table>
</body>
</html>
