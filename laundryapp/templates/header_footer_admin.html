<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/sidebar.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        .sidebar h3 {
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }
        .sidebar a {
            color: white;
            padding: 0.75rem 1rem;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.2s ease;
            margin-bottom: 0.5rem;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .sidebar a.active {
            background-color: #007bff;
        }
        .content {
            flex: 1;
            padding: 2rem;
            background-color: #f8f9fa;
        }
        .logout-link {
            margin-top: auto;
            background-color: red !important;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3 class="text-center">📋 Menu</h3>
        <a href="/adminhome/" class="{% if request.path == '/adminhome/' %}active{% endif %}">🏠 Home</a>
        <a href="/viewusers/" class="{% if request.path == '/viewusers/' %}active{% endif %}">👤 View Users</a>
        <a href="/viewshops/" class="{% if request.path == '/viewshops/' %}active{% endif %}">🏪 View Shops</a>
        <!-- <a href="/viewservices/">🧺 View Services</a> -->
        <a href="/viewfeedbacks/" class="{% if request.path == '/viewfeedbacks/' %}active{% endif %}">💬 View Feedbacks</a>
        <a href="/" class="logout-link">🚪 Logout</a>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
