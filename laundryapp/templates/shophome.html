{% extends 'header_footer_shop.html' %}
{% block content %}
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #f9fbfd;
        margin: 0;
        padding: 0;
    }

    .dashboard-container {
        max-width: 900px;
        margin: 40px auto;
        text-align: center;
    }

    .dashboard-container h1 {
        font-size: 32px;
        color: #2c3e50;
        margin-bottom: 40px;
    }

    .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 25px;
        padding: 0 20px;
    }

    .nav-card {
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        transition: all 0.2s ease-in-out;
    }

    .nav-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }

    .nav-card a {
        display: block;
        color: #3498db;
        text-decoration: none;
        font-weight: 600;
        font-size: 18px;
    }

    .nav-card a:hover {
        text-decoration: underline;
    }
</style>

<div class="dashboard-container">
    <h1>🏪 Shop Dashboard</h1>
    <div class="nav-grid">
        <div class="nav-card">
            <a href="/shopprofile">📋 Shop Profile</a>
        </div>
        <div class="nav-card">
            <a href="/viewstaffs">👥 Manage Staffs</a>
        </div>
        <div class="nav-card">
            <a href="/shopservice">🛠️ Shop Services</a>
        </div>
        <div class="nav-card">
            <a href="/showbookingsofshop">📦 View Bookings</a>
        </div>
        <div class="nav-card">
            <a href="/feedback/">💬 Feedback</a>
        </div>
        <div class="nav-card">
            <a href="/viewtransactionbyshopdaily">💰 View Transactions</a>
        </div>
    </div>
</div>
{% endblock %}
