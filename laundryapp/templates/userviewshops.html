<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="/userhome">back</a>
    <h1>this is all shop</h1>
    <table border="1">
        <tr>
            <th>Shop Name</th>
            <th>District</th>
            <th>Address</th>
            <th>View Services</th>
        </tr>

        {% if data %}
            {% for i in data %}
                <tr>
                    <td>{{ i.name }}</td>
                    <td>{{ i.district }}</td>
                    <td>{{ i.address }}</td>
                    <td><a href="/userviewservices/?id={{ i.shid }}">View Services</a></td>
                </tr>
            {% endfor %}
        {% else %}
            <tr>
                <td colspan="4">No shops available</td>
            </tr>
        {% endif %}
</body>
</html>
