<style>
    .password-form-container {
        max-width: 400px;
        margin: 40px auto;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        font-family: Arial, sans-serif;
    }

    .password-form-container h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    .password-form label {
        display: block;
        margin: 15px 0 5px;
        font-weight: bold;
        color: #555;
    }

    .password-form input[type="text"],
    .password-form input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
    }

    .password-form input[type="submit"] {
        margin-top: 20px;
        width: 100%;
        background-color: #4CAF50;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .password-form input[type="submit"]:hover {
        background-color: #45a049;
    }

    .forgot-link {
        display: block;
        text-align: center;
        margin-top: 15px;
        text-decoration: none;
        color: #007BFF;
    }

    .forgot-link:hover {
        text-decoration: underline;
    }
</style>
{% extends temp %}

{% block content %}
<div class="password-form-container">
    <h1>Change Password</h1>
    <form action="/changepass/"class="password-form">
        {% csrf_token %}
        <label for="prepass">Previous Password</label>
        <input type="password" name="prepass" id="prepass" required>

        <label for="newpass">New Password</label>
        <input type="password" name="newpass" id="newpass" required>

        <input type="submit" value="Submit">
    </form>
    <a href="/forgotpass/" class="forgot-link">Forgot password?</a>
</div>

{% endblock %}
