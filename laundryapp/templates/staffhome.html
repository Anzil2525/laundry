{% extends 'header_footer_staff.html' %}
{% load static %}

{% block content %}
<style>
  .staff-home {
    max-width: 600px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    text-align: center;
  }

  .staff-home h2 {
    font-weight: 700;
    color: #0d6efd;
    margin-bottom: 30px;
  }

  .staff-btn {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    background-color: #fd7e14;
    color: white;
    transition: background-color 0.3s ease;
    text-decoration: none;
  }

  .staff-btn:hover {
    background-color: #0d6efd;
    color: white;
  }
</style>

<div class="container">
  <div class="staff-home">
    <h2>🧑‍🔧 Staff Dashboard</h2>

    <a href="/staffprofile/?id={{ stid }}" class="staff-btn">👤 View Profile</a>
    <a href="/feedback/" class="staff-btn">🗣️ Feedback</a>
    <a href="/showbookingsofstaff/" class="staff-btn">📋 View Bookings</a>
  </div>
</div>
{% endblock %}
