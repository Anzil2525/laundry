<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="/shopservice/">back</a>
    <h1><center>service editing page</center></h1>
        <form action="/editservice/?id={{srid}}">
            <table>
                <tr>
                    <td>Service Name</td><td><input type="text" name="sname" value="{{service}}"></td>
                </tr>
                <tr>
                    <td>Amount</td><td><input type="text" name="amount" value="{{amount}}"></td>
                </tr>
                <tr>
                    <td>Description</td><td><textarea rows="4" cols="20" name="desc">{{descr}}</textarea></td>
                </tr>
                <tr>
                    <td></td><td><button name="id" value="{{srid}}">submit</button></td>
                </tr>
            </table>
        </form>
</body>
</html>
