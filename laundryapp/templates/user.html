<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
</head>
<body>
    {% extends 'header_footer_index.html' %}
    {% block content %}
    <br>
    <br>
    <br>
    <br>
    <h1 class="text-center mb-4">User Registration</h1>
    <br>
    <br>
    <br>
    <div class="d-flex justify-content-center">
        <form action="/userreg/" method="get" class="w-100" style="max-width: 500px;">
            <div class="mb-3">
                <label for="u_name" class="form-label">Name</label>
                <input type="text" class="form-control" id="u_name" name="u_name" pattern="[A-Z a-z]+" title="Use Ony Alphabets" required>
            </div>
            <div class="mb-3">
                <label for="u_address" class="form-label">Address</label>
                <textarea class="form-control" id="u_address" name="u_address" rows="3" required title = "Enter your full address"></textarea>
            </div>
            <div class="mb-3">
                <label for="u_district" class="form-label">District</label>
                <select class="form-select" id="u_district" name="u_district" title = "Select your district" required>
                    <option value="">Select District</option>
                    <option value="thiruvananthapuram">Thiruvananthapuram</option>
                    <option value="kollam">Kollam</option>
                    <option value="alappuzha">Alappuzha</option>
                    <option value="pathanamthitta">Pathanamthitta</option>
                    <option value="kottayam">Kottayam</option>
                    <option value="idukki">Idukki</option>
                    <option value="ernakulam">Ernakulam</option>
                    <option value="thrissur">Thrissur</option>
                    <option value="palakkad">Palakkad</option>
                    <option value="malappuram">Malappuram</option>
                    <option value="kozhikode">Kozhikode</option>
                    <option value="wayanad">Wayanad</option>
                    <option value="kannur">Kannur</option>
                    <option value="kasaragod">Kasaragod</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="u_place" class="form-label">Place</label>
                <input type="text" class="form-control" id="u_place" name="u_place" title = "Use only alphabets" pattern="[A-Z a-z]+" required>
            </div>
            <div class="mb-3">
                <label for="u_ph_no" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="u_ph_no" title="Enter a valid 10-digit phone number" name="u_ph_no" pattern="[0-9]{10}"  maxlength="10" required>
            </div>
            <div class="mb-3">
                <label for="u_email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="u_email" name="u_email" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Email must be in the format: example@domain.com" required>
            </div>
            
            <div class="mb-3">
                <label for="u_password" class="form-label">Password</label>
                <input type="password" class="form-control" id="u_password" name="u_password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one  number and one uppercase and lowercase letter, and at least 8 or more characters" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary px-5">Submit</button>
            </div>
            <br>
            <br>
            already have an account? <a href="/login/">Login</a>
        </form>
    </div>
    
    {% endblock %}
</body>
</html>
