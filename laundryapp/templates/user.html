<!DOCTYPE html>
<html>
    <head>
        <title>user</title>
    </head>
    <bdoy>
        <h1><center>USER</center></h1>
        <form action="/userreg">
            <table>
                <tr>
                    <td>Name</td><td><input type="text" name="u_name" required></td>
                </tr>
                <tr>
                    <td>Address</td><td><textarea name="u_address" rows=4 required></textarea></td>
                 </tr>
                 <td>District</td>
                    <td>
                        <select name="u_district" required>
                            <option ></option>
                            <option value="thiruvananthapuram">Thiruvananthapuram</option>
                            <option value="kollam">Kollam</option>
                            <option value="alappuzha">Alappuzha</option>
                            <option value="pathanamthitta">Pathanamthitta</option>
                            <option value="kottayam">Kottayam</option>
                            <option value="idukki">Idukki</option>
                            <option value="ernakulam">Ernakulam</option>
                            <option value="thrissur">Thrissur</option>
                            <option value="palakkad">Palakkad</option>
                            <option value="malappuram">Malappuram</option>
                            <option value="kozhikode">Kozhikode</option>
                            <option value="wayanad">Wayanad</option>
                            <option value="kannur">Kannur</option>
                            <option value="kasaragod">Kasaragod</option>
                        </select>                       
                    </td>
                </tr>

                 <tr>
                    <td>Phone Number</td><td><input type="text" name="u_ph_no" pattern="[0-9]{10}" maxlength="10" required></td>
                </tr>
                <tr>
                    <td>E-mail</td><td><input type="email" name="u_email" required></td>
                </tr>
                <tr>
                    <td>Place</td><td><input type="text" name="u_place" required></td>
                </tr>
                <tr>
                    <td>Password</td><td><input type="password" name="u_password" required></td>
                </tr>
                <tr>
                    <td></td><td><input type="submit" value="Submit"></td>
                </tr>
            </table>
        </form>
    </bdoy>
</html>
