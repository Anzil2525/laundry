<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'header_footer_admin.html' %}

    {% block content %}
    <h1>view feedbacks</h1>
    <table border="1">
        <tr>
            <th>Feedbacks</th>
            <th>Date</th>
            <th>Time</th>
            <th>User ID</th>
            <th>User Type</th>
        </tr>
        {% if data %}

            {% for obj in data %}
                <tr>
                    <td>{{obj.feedback}}</td><td>{{obj.date}}</td>
                    <td>{{obj.time}}</td>
                    <td>{{obj.uid}}</td>
                    <td>{{obj.utype}}</td>

                </tr>
            {% endfor %}
        {% else %}
        <tr>
            <td colspan="5" style="text-align: center;">no record</td>
        </tr>
        {% endif %}
        {% endblock %}
</body>
</html>
