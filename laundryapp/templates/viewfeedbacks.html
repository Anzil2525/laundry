<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="/">index</a>
    <h1>view feedbacks</h1>
    <table border="1">
        <tr>
            <th>Feedbacks</th>
            
        </tr>
        {% if data %}

            {% for obj in data %}
                <tr>
                    <td>{{obj.feedback}}</td>
                </tr>
            {% endfor %}
        {% else %}
        <tr>
            <td style="text-align: center;">no record</td>
        </tr>
        {% endif %}
</body>
</html>
