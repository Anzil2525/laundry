<!DOCTYPE html>
<html>
    <head>
        <title>shop</title>
    </head>
    <body>
        <a href="/">Back</a>
        <h1><center>shop</center></h1>
        <form action="/shopreg">
            <table>
                <tr>
                    <td>Name Of Shop</td><td><input type="text" name="shop_name" required></td>
                </tr>
                <tr>
                    <td>Address</td><td><textarea name="shop_address" rows=4 required></textarea></td>
                 </tr>
                 <tr>
                    <td>Place</td><td><input type="text" name="shop_place" required></td>
                </tr>
                <tr>
                    <td>District</td>
                    <td>
                        <select name="shop_district" required>
                            <option ></option>
                            <option value="thiruvananthapuram">Thiruvananthapuram</option>
                            <option value="kollam">Kollam</option>
                            <option value="alappuzha">Alappuzha</option>
                            <option value="pathanamthitta">Pathanamthitta</option>
                            <option value="kottayam">Kottayam</option>
                            <option value="idukki">Idukki</option>
                            <option value="ernakulam">Ernakulam</option>
                            <option value="thrissur">Thrissur</option>
                            <option value="palakkad">Palakkad</option>
                            <option value="malappuram">Malappuram</option>
                            <option value="kozhikode">Kozhikode</option>
                            <option value="wayanad">Wayanad</option>
                            <option value="kannur">Kannur</option>
                            <option value="kasaragod">Kasaragod</option>
                        </select>                       
                    </td>
                </tr>
                <tr>
                    <td>Phone Number</td><td><input type="text" name="shop_ph_no" pattern="[0-9]{10}" maxlength="10" required></td>
                </tr>
                <tr>
                    <td>E-mail</td><td><input type="email" name="shop_email" required></td>
                </tr>
                <tr>
                    <td>Password</td><td><input type="password" name="shop_password" required></td>
                </tr>
                <tr>
                    <td></td><td><input type="submit" value="Submit"></td>
                </tr>
            </table>
        </form>
    </body>
</html>
